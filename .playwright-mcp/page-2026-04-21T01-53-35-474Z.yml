      - generic [ref=e61]: "Geodesics are the straightest possible paths a surface allows — they have zero covariant acceleration. The amber curve solves ẍᵏ + Γᵏᵢⱼ ẋⁱ ẋʲ = 0. A particle with no force acting on it follows a geodesic. On a sphere that path looks curved. In spacetime, gravity works the same way: no force — just geometry."
