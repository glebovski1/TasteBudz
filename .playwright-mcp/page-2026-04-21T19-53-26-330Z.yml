        - generic [ref=e185]:
          - generic [ref=e186]: What this lab does
          - generic [ref=e187]: This is the first Newton-Cartan scene turned into a toy geodesic lab. You set the bulge profile, launch one or two bodies with the same initial slope, and watch how the connection changes their trajectories from slice to slice.
        - generic [ref=e189]:
          - generic [ref=e190]: How to use it
          - generic [ref=e191]: Set Bulge drift to zero for the static case. Turn on Two bodies, give them the same launch slope, and compare how the separation changes. Then add drift so the bulge slides between them and watch how the geodesics respond to the moving curvature center.
